<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fundir — Funder Dossier (redesign reference)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-900:#0B1220; --ink-700:#1E2A40; --ink-600:#33425C; --ink-500:#5A6B86;
    --ink-400:#8696AE; --ink-300:#B6C2D4; --ink-200:#DCE3ED; --ink-100:#EEF2F7;
    --ink-50:#F6F8FB; --surface:#FFFFFF;
    --accent:#0C6B5A; --accent-hover:#0A5648; --accent-bright:#15917A; --accent-tint:rgba(12,107,90,.10);
    --success:#2F9E6E; --warning:#C0852B; --warning-tint:rgba(192,133,43,.10);
    --critical:#C24E3E; --info:#3E6CA8;
    --radius:10px; --radius-sm:7px;
    --mono:"JetBrains Mono",ui-monospace,monospace;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink-50);color:var(--ink-900);
    font-family:"Inter",system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .wrap{max-width:1080px;margin:0 auto;padding:34px 28px 80px}
  a{color:var(--accent);text-decoration:none}
  .lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-500);font-weight:600}

  /* panel header */
  .panelhead{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
  .panelhead .eye{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .panelhead h1{font-size:23px;font-weight:600;letter-spacing:-.02em;margin:0}
  .panelhead .sub{color:var(--ink-500);font-size:13px;margin-top:6px}
  .panelhead .sub b{color:var(--ink-700);font-weight:600}
  .rankby{font-family:var(--mono);font-size:11px;color:var(--ink-400);display:flex;align-items:center;gap:6px}

  .listhead{display:flex;align-items:center;gap:18px;padding:9px 22px;border-bottom:1px solid var(--ink-200)}
  .listhead .lab{flex:1}

  /* funder row */
  .row{background:var(--surface);border:1px solid var(--ink-200);border-radius:var(--radius);margin-top:14px;overflow:hidden;transition:border-color .2s}
  .row.open{border-color:var(--ink-300)}
  .rowhead{display:flex;align-items:center;gap:18px;padding:18px 22px;cursor:pointer;user-select:none}
  .score{font-family:var(--mono);font-weight:700;font-size:18px;width:46px;height:46px;flex:none;border-radius:9px;
    display:flex;align-items:center;justify-content:center;background:var(--accent-tint);color:var(--accent);border:1px solid rgba(12,107,90,.18)}
  .score.mid{background:rgba(192,133,43,.10);color:var(--warning);border-color:rgba(192,133,43,.2)}
  .rname{flex:1;min-width:0}
  .rname .n{font-size:17px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
  .rname .n .type{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--ink-400);border:1px solid var(--ink-200);border-radius:5px;padding:3px 7px;font-weight:600}
  .rname .meta{color:var(--ink-500);font-size:12.5px;margin-top:5px}
  .rname .meta b{color:var(--ink-700);font-weight:600;font-family:var(--mono)}
  .rstatus{display:flex;align-items:center;gap:10px;color:var(--ink-500);font-size:12.5px;flex:none}
  .rstatus .dot{width:6px;height:6px;border-radius:50%;background:var(--success)}
  .chev{transition:transform .3s var(--ease);color:var(--ink-400)}
  .row.open .chev{transform:rotate(180deg)}

  /* dossier body */
  .body{max-height:0;overflow:hidden;transition:max-height .42s var(--ease)}
  .row.open .body{max-height:3000px}
  .bin{padding:4px 22px 26px;border-top:1px solid var(--ink-100)}

  .reveal{opacity:0;transform:translateY(8px);transition:opacity .42s var(--ease),transform .42s var(--ease)}
  .row.open .reveal.in{opacity:1;transform:none}

  /* at a glance */
  .glance{display:grid;grid-template-columns:200px 1fr;gap:22px;padding:22px 0 6px;align-items:center}
  .gauge{display:flex;flex-direction:column;align-items:center;gap:12px}
  .gauge svg{width:120px;height:120px}
  .gauge .gnum{font-family:var(--mono);font-weight:700;font-size:30px;fill:var(--ink-900)}
  .gauge .glabel{font-family:var(--mono);font-size:9px;letter-spacing:.16em;fill:var(--ink-400)}
  .factors{display:flex;flex-direction:column;gap:9px;width:100%}
  .factor{display:grid;grid-template-columns:74px 1fr 30px;align-items:center;gap:10px}
  .factor .fl{font-size:11px;color:var(--ink-500)}
  .factor .track{height:5px;background:var(--ink-100);border-radius:4px;overflow:hidden}
  .factor .track i{display:block;height:100%;width:0;background:var(--accent);border-radius:4px;transition:width .8s var(--ease)}
  .factor .fv{font-family:var(--mono);font-size:11px;color:var(--ink-600);text-align:right}

  .tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .tile{border:1px solid var(--ink-200);border-radius:var(--radius-sm);padding:12px 13px;background:var(--ink-50)}
  .tile .tl{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-500)}
  .tile .tv{font-family:var(--mono);font-weight:600;font-size:18px;margin-top:5px;letter-spacing:-.01em}
  .tile .tv small{font-size:12px;color:var(--ink-500);font-weight:500}

  .sec{margin-top:26px}
  .sec > .lab{display:block;margin-bottom:12px}

  /* ask band */
  .askband{border:1px solid var(--ink-200);border-radius:var(--radius);padding:20px 22px 10px;background:var(--surface)}
  .askband svg{width:100%;height:170px;display:block;overflow:visible}
  .axisline{stroke:var(--ink-200);stroke-width:1.5}
  .tick{stroke:var(--ink-200);stroke-width:1}
  .ticktext{font-family:var(--mono);font-size:10px;fill:var(--ink-400)}
  .band{fill:var(--accent-tint);stroke:rgba(12,107,90,.28);stroke-width:1;rx:6}
  .bandlab{font-family:var(--mono);font-size:10px;font-weight:600;fill:var(--accent)}
  .pdot{cursor:pointer;transition:r .15s var(--ease)}
  .pdot circle{fill:var(--surface);stroke:var(--ink-400);stroke-width:2;transition:all .15s var(--ease)}
  .pdot.inband circle{stroke:var(--accent);fill:var(--accent)}
  .pdot.risk circle{stroke:var(--warning);fill:var(--warning)}
  .pdot .amt{font-family:var(--mono);font-size:10px;font-weight:600;fill:var(--ink-600);text-anchor:middle}
  .pdot.hot circle{r:9;stroke-width:3}
  .avgmark{fill:var(--ink-500)}
  .avgtext{font-family:var(--mono);font-size:9.5px;fill:var(--ink-500);text-anchor:middle}

  .twocol{display:grid;grid-template-columns:1.15fr 1fr;gap:22px;margin-top:26px}
  @media(max-width:820px){.twocol{grid-template-columns:1fr}.glance{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,1fr)}}

  /* peer ledger */
  .ledger{display:flex;flex-direction:column}
  .pl-row{display:grid;grid-template-columns:1fr 64px 96px 22px;align-items:center;gap:12px;padding:11px 10px;border-radius:8px;cursor:default;transition:background .15s}
  .pl-row:hover,.pl-row.hot{background:var(--ink-50)}
  .pl-row .pn{font-size:13.5px;font-weight:500}
  .pl-row .bar{grid-column:1 / 2;height:4px;background:var(--ink-100);border-radius:3px;margin-top:7px;overflow:hidden}
  .pl-row .bar i{display:block;height:100%;width:0;background:var(--ink-300);border-radius:3px;transition:width .7s var(--ease)}
  .pl-row.inband .bar i{background:var(--accent)}
  .pl-row.risk .bar i{background:var(--warning)}
  .pl-row .fy{font-family:var(--mono);font-size:11px;color:var(--ink-500)}
  .pl-row .amt{font-family:var(--mono);font-size:13px;font-weight:600;text-align:right}
  .pl-row .ev{color:var(--ink-300);display:flex;justify-content:center}
  .pl-row .ev:hover{color:var(--accent)}
  .pl-cell{display:flex;flex-direction:column}

  /* warm path */
  .approach{display:flex;flex-direction:column;gap:18px}
  .warmpath{border:1px solid var(--ink-200);border-radius:var(--radius);padding:18px;background:var(--surface)}
  .flow{display:flex;align-items:stretch;gap:0;margin-top:12px}
  .node{flex:1;border:1px solid var(--ink-200);border-radius:8px;padding:10px 11px;background:var(--ink-50);text-align:center}
  .node.you{border-color:var(--accent);background:var(--accent-tint)}
  .node.target{border-style:dashed}
  .node .nl{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-400)}
  .node .nn{font-size:12px;font-weight:600;margin-top:4px;line-height:1.25}
  .arrow{display:flex;align-items:center;color:var(--ink-300);padding:0 8px;font-size:16px}
  .approachcap{font-size:12.5px;color:var(--ink-500);margin-top:12px;line-height:1.5}

  .risk{border:1px solid var(--ink-200);border-left:3px solid var(--warning);border-radius:var(--radius);padding:16px 18px;background:var(--surface)}
  .risk .rt{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .risk .rtag{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--warning);font-weight:600}
  .risk p{margin:0;font-size:13px;color:var(--ink-600);line-height:1.55}
  .risk p mark{background:var(--warning-tint);color:var(--ink-700);padding:0 3px;border-radius:3px}

  .bg{margin-top:26px;font-size:13.5px;color:var(--ink-600);line-height:1.6;max-width:78ch}

  /* citation chips */
  .cite{font-family:var(--mono);font-size:9px;font-weight:600;color:var(--accent);background:var(--accent-tint);
    border-radius:4px;padding:1px 5px;margin:0 1px;cursor:pointer;vertical-align:super;line-height:1;position:relative;top:-2px}
  .cite:hover{background:var(--accent);color:#fff}

  /* sources */
  .sources{margin-top:26px;border-top:1px solid var(--ink-100);padding-top:18px}
  .src{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:7px;font-size:12.5px;transition:background .15s}
  .src.hot{background:var(--accent-tint)}
  .src .si{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--ink-400);width:18px;height:18px;border:1px solid var(--ink-200);border-radius:5px;display:flex;align-items:center;justify-content:center;flex:none}
  .src .st{color:var(--ink-600)}
  .src .st b{color:var(--ink-900);font-weight:600}
  .src .amt{font-family:var(--mono);margin-left:auto;color:var(--ink-500)}

  .footctl{display:flex;justify-content:flex-end;margin-top:18px}
  .ghostbtn{font-family:"Inter";font-size:12.5px;color:var(--ink-500);border:1px solid var(--ink-200);background:var(--surface);
    border-radius:7px;padding:7px 13px;cursor:pointer;display:flex;align-items:center;gap:7px}
  .ghostbtn:hover{color:var(--ink-900);border-color:var(--ink-300)}

  /* collapsed sibling */
  .row.collapsed .rowhead{cursor:pointer}
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important}
    .reveal{opacity:1;transform:none}
    .body{transition:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <!-- Original reference body preserved here verbatim. See:
       components/funder-brief.tsx for the React port. -->
</div>
</body>
</html>
